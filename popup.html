<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>M3U8 &amp; MP4 Video Link Detector</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 380px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0d0d0f;
        color: #f2f2f3;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px; border-bottom: 1px solid #232327;
      }
      h1 { font-size: 13px; margin: 0; letter-spacing: .02em; }
      .brand { color: #e04a32; font-weight: 700; }
      button, .support {
        font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #2e2e34;
        background: #17171b; color: #f2f2f3; padding: 5px 9px; font-size: 12px;
        text-decoration: none; display: inline-block;
      }
      button.primary { background: #e04a32; border-color: #e04a32; color: #fff; font-weight: 600; }
      button:hover, .support:hover { filter: brightness(1.12); }
      ul { list-style: none; margin: 0; padding: 8px; max-height: 380px; overflow-y: auto; }
      li { border: 1px solid #232327; border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; background: #121216; }
      .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
      .type { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #e04a32; }
      .url { font-size: 11px; word-break: break-all; color: #b8b8bf; margin: 6px 0 8px; font-family: ui-monospace, monospace; }
      .actions { display: flex; gap: 6px; }
      footer {
        border-top: 1px solid #232327; padding: 9px 14px; font-size: 11px; color: #8a8a93;
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      footer a { color: #e04a32; text-decoration: none; }
      .empty { padding: 26px 16px; text-align: center; font-size: 12px; color: #8a8a93; line-height: 1.6; }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="brand">Coders Hub</span> · M3U8 &amp; MP4 Detector</h1>
      <div style="display:flex;gap:6px;align-items:center">
        <a id="support" class="support" href="https://coders-hub.com/support" target="_blank" rel="noopener noreferrer">☕ Support</a>
        <button id="clear">Clear</button>
      </div>
    </header>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>
      No video links detected yet.<br />Start playing the video, then reopen this popup.
    </div>
    <footer>
      <span>Detects .m3u8 · .mpd · .mp4 · .webm · .mov</span>
      <a href="https://coders-hub.com" target="_blank" rel="noopener noreferrer">All tools</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
